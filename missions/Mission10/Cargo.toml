[package]
name = "mission10"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
weighted = []
serde_support = ["serde"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
axum = "0.8.7"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.7", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "comparison"
harness = false

[lib]
name = "mission10"
path = "src/lib.rs"

[[example]]
name = "mission10_demo"
path = "examples/demo.rs"

[[example]]
name = "connected_components"
path = "examples/connected_components.rs"

[[example]]
name = "network_connectivity"
path = "examples/network_connectivity.rs"
