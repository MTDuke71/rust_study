[package]
name = "mission11"
version = "0.1.0"
edition = "2021"
authors = ["MTDuke71"]
description = "Mission 11: Dynamic Programming with Memoization - V-Cycle Implementation"
license = "MIT"
repository = "https://github.com/MTDuke71/rust_study"

[lib]
name = "mission11"
path = "src/lib.rs"

[[example]]
name = "demo_fibonacci"
path = "examples/demo_fibonacci.rs"

[[example]]
name = "demo_aoc_day12"
path = "examples/demo_aoc_day12.rs"

[[example]]
name = "demo_counting_paths"
path = "examples/demo_counting_paths.rs"

[[example]]
name = "demo_string_matching"
path = "examples/demo_string_matching.rs"

[dependencies]
# No external dependencies for core implementation

[dev-dependencies]
criterion = "0.5"

# Benchmark will be added after REQ-1 implementation complete
# [[bench]]
# name = "memoization"
# harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
