[package]
name = "mission9"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Mission 9: Dijkstra & A* Pathfinding Algorithms"

[dependencies]
thiserror = "1.0"
priority-queue = "1.3"
indexmap = "2.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pathfinding_benchmarks"
harness = false

[features]
default = []
visualize = ["petgraph"]
parallel = ["rayon"]

[dependencies.petgraph]
version = "0.6"
optional = true

[dependencies.rayon]
version = "1.7"
optional = true