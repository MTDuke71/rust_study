[package]
name = "mission9"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Mission 9: Dijkstra & A* Pathfinding Algorithms"

[[bin]]
name = "mission9"
path = "src/main.rs"

[[bin]]
name = "mission9-grid"
path = "src/main_grid.rs"

[dependencies]
thiserror = "1.0"
priority-queue = "1.3"
indexmap = "2.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"

[[bench]]
name = "pathfinding_benchmarks"
harness = false

[[example]]
name = "step4_performance_demo"
path = "examples/step4_performance_demo.rs"

[features]
default = []
visualize = ["petgraph"]
parallel = ["rayon"]

[dependencies.petgraph]
version = "0.6"
optional = true

[dependencies.rayon]
version = "1.7"
optional = true