[package]
name = "install-example"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "An example binary crate that can be installed with cargo install"
license = "MIT OR Apache-2.0"

# 14.4 - Installing Binaries from Crates.io with cargo install
# This example shows how to create an installable binary crate

[[bin]]
name = "install-example"
path = "src/main.rs"

# Optional: Additional binaries
# [[bin]]
# name = "install-example-helper"
# path = "src/helper.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }

