[package]
name = "install-example"
version = "0.1.0"
edition = "2021"

# 14.4 - Installing Binaries from Crates.io with cargo install
# This example demonstrates HOW TO INSTALL existing binary crates from crates.io
# 
# Popular binary crates you can install:
# - ripgrep: Fast text search tool (rg)
# - fd-find: Fast file finder (fd)  
# - bat: Better cat with syntax highlighting
# - exa: Better ls with colors and git integration
# - tokei: Code statistics tool
# - cargo-watch: Auto-rebuild on file changes
#
# Installation examples:
# cargo install ripgrep
# cargo install fd-find
# cargo install bat
# cargo install exa
#
# Then use them from anywhere:
# rg "pattern" files/
# fd filename
# bat file.rs
# exa -la

[dependencies]
# This crate demonstrates the installation process, not the creation process

