[package]
name = "release_profiles"
version = "0.1.0"
edition = "2021"

# 14.1 - Customizing Builds with Release Profiles
# This example demonstrates Cargo's release profiles
# Note: Profile configurations should be defined at the workspace root (d:\repos\rust_study\Cargo.toml)
# not in individual packages. The examples below show the syntax but are commented out
# to avoid "profiles will be ignored" warnings.

# For actual profile customization, add these to the workspace root Cargo.toml:
#
# [profile.dev]
# opt-level = 0
#
# [profile.release]
# opt-level = 3
#
# [profile.release-with-debug]
# inherits = "release"
# debug = true

