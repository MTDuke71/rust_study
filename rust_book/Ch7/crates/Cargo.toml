[package]
name = "crates"
version = "0.1.0"
edition = "2021"
description = "Chapter 7.1: Demonstrates the difference between library and binary crates"

# This package contains both a library crate (src/lib.rs) and binary crates
# The library crate provides functionality that the binary crates can use

[[bin]]
name = "binary_example"
path = "src/binary_example.rs"

[[bin]]
name = "library_example"
path = "src/library_example.rs"
