[package]
name = "rust_learning_week6"
version = "0.1.0"
edition = "2021"

# Mark as standalone package (not part of workspace)
[workspace]

# Features for Day 38 demonstration
[features]
default = ["std"]
std = []
alloc = []  # For no_std + alloc demonstration
debug-info = ["std"]
serde = ["dep:serde", "dep:serde_json", "std"]
parallel = ["dep:rayon", "std"]
full = ["debug-info", "serde", "parallel"]

[dependencies]
# Optional dependencies for feature demonstration
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rayon = { version = "1.7", optional = true }

[[bin]]
name = "day36_standalone"
path = "Day36.rs"

[[bin]]
name = "Day37"
path = "Day37.rs"

[[bin]]
name = "Day38"
path = "Day38.rs"

[[bin]]
name = "Day39"
path = "Day39.rs"
