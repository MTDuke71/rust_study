name: Nightly Clippy Check (Analysis Only)

on:
  schedule:
    # Run every night at 2:00 AM EST (7:00 AM UTC) - before the auto-fix workflow
    - cron: '0 7 * * *'
  
  # Allow manual triggering of the workflow
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h
    
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    
    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Run Clippy on workspace
      id: workspace-clippy
      continue-on-error: true
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    
    - name: Run Clippy on individual packages
      id: individual-clippy
      continue-on-error: true
      run: |
        # Get all packages in the workspace
        packages=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source == null) | .name')
        
        echo "Found packages:"
        echo "$packages"
        
        # Run clippy on each package individually, continue on errors
        exit_code=0
        for package in $packages; do
          echo "Running clippy on package: $package"
          if ! cargo clippy -p "$package" --all-targets --all-features -- -D warnings; then
            echo "❌ Clippy failed for package: $package"
            exit_code=1
          else
            echo "✅ Clippy passed for package: $package"
          fi
        done
        
        # Set final exit code but don't fail the step (continue-on-error handles this)
        exit $exit_code
    
    - name: Generate Clippy report
      id: clippy-report
      if: always()
      run: |
        # Create reports directory
        mkdir -p reports
        
        echo "# Nightly Clippy Report - $(date)" > reports/clippy-report.md
        echo "" >> reports/clippy-report.md
        echo "## Summary" >> reports/clippy-report.md
        echo "- Workspace: $(cargo metadata --no-deps --format-version 1 | jq -r '.workspace_root')" >> reports/clippy-report.md
        echo "- Packages: $(cargo metadata --no-deps --format-version 1 | jq -r '.packages | length')" >> reports/clippy-report.md
        echo "- Rust version: $(rustc --version)" >> reports/clippy-report.md
        echo "- Clippy version: $(cargo clippy --version)" >> reports/clippy-report.md
        echo "" >> reports/clippy-report.md
        
        # Check results from previous steps
        workspace_result="${{ steps.workspace-clippy.outcome }}"
        individual_result="${{ steps.individual-clippy.outcome }}"
        
        echo "## Step Results" >> reports/clippy-report.md
        echo "- Workspace clippy: $workspace_result" >> reports/clippy-report.md
        echo "- Individual packages clippy: $individual_result" >> reports/clippy-report.md
        echo "" >> reports/clippy-report.md
        
        # Run clippy with JSON output for detailed reporting
        echo "## Detailed Results" >> reports/clippy-report.md
        set +e  # Don't exit on error
        cargo clippy --workspace --all-targets --all-features --message-format=json > reports/clippy-output.json 2>&1
        clippy_exit_code=$?
        set -e  # Re-enable exit on error
        
        # Determine overall success based on all steps
        if [ "$workspace_result" = "success" ] && [ "$individual_result" = "success" ] && [ $clippy_exit_code -eq 0 ]; then
          echo "✅ All clippy checks passed!" >> reports/clippy-report.md
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "⚠️ Clippy issues detected in one or more checks. Please review and fix." >> reports/clippy-report.md
          echo "success=false" >> $GITHUB_OUTPUT
        fi
        
        # Always ensure files exist for upload
        touch reports/clippy-report.md reports/clippy-output.json
    
    - name: Upload Clippy report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clippy-report-${{ github.run_number }}
        path: |
          ./reports/clippy-report.md
          ./reports/clippy-output.json
        retention-days: 30
    
    # Optional: Create an issue if clippy finds problems
    - name: Create issue on clippy warnings
      if: steps.clippy-report.outputs.success == 'false'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './reports/clippy-report.md';
          
          let body = '🚨 **Nightly Clippy Check Failed**\n\n';
          body += 'The automated clippy check found issues that need attention.\n\n';
          
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            body += '## Report\n\n' + report;
          }
          
          body += '\n\n**Run Details:**\n';
          body += `- Run ID: ${context.runId}\n`;
          body += `- Commit: ${context.sha}\n`;
          body += `- Triggered: ${new Date().toISOString()}\n`;
          
          // Check if there's already an open issue for clippy failures
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['clippy-failure', 'automated'],
            state: 'open'
          });
          
          if (issues.data.length === 0) {
            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly Clippy Check Failed - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['clippy-failure', 'automated', 'bug']
            });
          } else {
            // Update existing issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body: '## New Failure Report\n\n' + body
            });
          }
    
    # Fail the job if any clippy issues were found (after collecting all results)
    - name: Final status check
      if: always()
      run: |
        if [ "${{ steps.clippy-report.outputs.success }}" = "false" ]; then
          echo "❌ Clippy checks failed. See report for details."
          exit 1
        else
          echo "✅ All clippy checks passed successfully!"
        fi