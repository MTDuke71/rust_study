name: Nightly Test Suite & Quality Check

on:
  schedule:
    # Run every night at 2:00 AM EST (7:00 AM UTC) - before clippy at 3:00 AM
    - cron: '0 7 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  comprehensive-test-suite:
    name: Comprehensive Test Suite & Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    
    - name: Install cargo-tarpaulin for code coverage
      run: |
        cargo install cargo-tarpaulin --locked
    
    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-test-
          ${{ runner.os }}-cargo-
    
    # ============================================================================
    # COMPILATION CHECK
    # ============================================================================
    - name: Check compilation (all targets)
      id: compilation
      continue-on-error: true
      run: |
        echo "🔍 Checking compilation across all targets..."
        
        # Create reports directory
        mkdir -p reports
        
        # Check workspace compilation
        echo "Workspace compilation check:" > reports/compilation-report.json
        cargo check --workspace --all-targets --all-features --message-format=json 2>&1 | tee -a reports/compilation-report.json
        
        # Individual package checks for comprehensive coverage
        for dir in missions/Mission* tutorials/Mission*_tut rust_book/Ch* advent_of_code/aoc*; do
          if [ -d "$dir" ] && [ -f "$dir/Cargo.toml" ]; then
            echo "Checking $dir..." | tee -a reports/compilation-report.json
            (cd "$dir" && cargo check --all-targets --all-features --message-format=json 2>&1 | tee -a ../reports/compilation-report.json || true)
          fi
        done
        
        echo "compilation_status=completed" >> $GITHUB_OUTPUT
    
    # ============================================================================
    # COMPREHENSIVE TEST EXECUTION
    # ============================================================================
    - name: Run comprehensive test suite
      id: test-suite
      continue-on-error: true
      shell: bash
      run: |
        echo "🧪 Running comprehensive test suite..."
        
        # Ensure reports directory exists
        mkdir -p reports
        
        # Run workspace tests and capture output
        # Note: Using || true to ensure script continues even if tests fail
        # This allows parsing logic to run and report actual test counts
        echo "Running workspace tests..."
        cargo test --workspace --all-targets --all-features 2>&1 | tee reports/test-output.txt || true
        # Capture the exit code from cargo test, not tee
        workspace_exit_code=${PIPESTATUS[0]}
        
        echo "Test execution completed with exit code: $workspace_exit_code"
        
        # Check for compilation failures
        compilation_failed="false"
        if grep -q "could not compile" reports/test-output.txt; then
          compilation_failed="true"
          echo "⚠️ Compilation failures detected"
        fi
        
        # Parse test results from the output file
        echo "Parsing test results from test output..."
        
        total_tests=0
        passed_tests=0
        failed_tests=0
        
        # Count test result lines for debugging
        result_line_count=$(grep -c "test result:" reports/test-output.txt || echo "0")
        echo "Found $result_line_count test result lines"
        
        # Parse all test result lines from the output
        while IFS= read -r line; do
          if [[ $line =~ test\ result:\ ok\.\ ([0-9]+)\ passed ]]; then
            count=${BASH_REMATCH[1]}
            passed_tests=$((passed_tests + count))
            echo "  Found OK result: $count passed"
          elif [[ $line =~ test\ result:\ FAILED\.\ ([0-9]+)\ passed ]]; then
            count=${BASH_REMATCH[1]}
            passed_tests=$((passed_tests + count))
            echo "  Found FAILED result: $count passed"
          fi
          
          if [[ $line =~ ([0-9]+)\ failed ]]; then
            count=${BASH_REMATCH[1]}
            if [ "$count" != "0" ]; then
              failed_tests=$((failed_tests + count))
              echo "  Found failures: $count failed"
            fi
          fi
        done < reports/test-output.txt
        
        total_tests=$((passed_tests + failed_tests))
        
        echo ""
        echo "==================================="
        echo "Test Parsing Summary:"
        echo "  Passed: $passed_tests"
        echo "  Failed: $failed_tests"
        echo "  Total:  $total_tests"
        echo "  Exit code: $workspace_exit_code"
        echo "==================================="
        
        # If no tests were found but exit code is non-zero, check for compilation issues
        if [ "$total_tests" -eq 0 ] && [ "$workspace_exit_code" -ne 0 ]; then
          echo "⚠️ No tests executed - likely due to compilation failures"
          compilation_failed="true"
        fi
        
        # Create JSON report summary
        echo "{" > reports/test-results.json
        echo "  \"test_run\": \"nightly\"," >> reports/test-results.json
        echo "  \"timestamp\": \"$(date -u +"%Y-%m-%d %H:%M:%S UTC")\"," >> reports/test-results.json
        echo "  \"total_tests\": $total_tests," >> reports/test-results.json
        echo "  \"passed_tests\": $passed_tests," >> reports/test-results.json
        echo "  \"failed_tests\": $failed_tests," >> reports/test-results.json
        echo "  \"workspace_exit_code\": $workspace_exit_code," >> reports/test-results.json
        echo "  \"compilation_failed\": $compilation_failed" >> reports/test-results.json
        echo "}" >> reports/test-results.json
        
        echo "Exporting results to GITHUB_OUTPUT..."
        # Export results
        echo "total_tests=$total_tests" >> $GITHUB_OUTPUT
        echo "passed_tests=$passed_tests" >> $GITHUB_OUTPUT  
        echo "failed_tests=$failed_tests" >> $GITHUB_OUTPUT
        echo "workspace_exit_code=$workspace_exit_code" >> $GITHUB_OUTPUT
        echo "compilation_failed=$compilation_failed" >> $GITHUB_OUTPUT
        
        echo "Test Summary: $passed_tests/$total_tests passed, $failed_tests failed"
    
    # ============================================================================
    # DOCUMENTATION TESTS (Including the fix we made)
    # ============================================================================
    - name: Run documentation tests
      id: doc-tests
      continue-on-error: true
      run: |
        echo "📚 Running documentation tests..."
        
        # Ensure reports directory exists
        mkdir -p reports
        
        echo '{"doc_test_run": "nightly"}' > reports/doc-test-results.json
        
        # Test documentation generation
        cargo doc --workspace --no-deps --all-features 2>&1 | tee -a reports/doc-test-results.json
        doc_gen_exit_code=$?
        
        # Run doc tests (code examples in documentation)
        cargo test --workspace --doc 2>&1 | tee -a reports/doc-test-results.json
        doc_test_exit_code=$?
        
        echo "doc_gen_exit_code=$doc_gen_exit_code" >> $GITHUB_OUTPUT
        echo "doc_test_exit_code=$doc_test_exit_code" >> $GITHUB_OUTPUT
    
    # ============================================================================
    # CLIPPY ANALYSIS (Enhanced)
    # ============================================================================
    - name: Enhanced clippy analysis
      id: clippy-analysis
      continue-on-error: true
      run: |
        echo "📋 Running enhanced clippy analysis..."
        
        echo '{"clippy_run": "nightly"}' > clippy-results.json
        
        # Run clippy with various lint levels
        echo "Standard clippy check:" | tee -a clippy-results.json
        cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee -a clippy-results.json
        clippy_exit_code=$?
        
        # Pedantic clippy for additional insights
        echo "Pedantic clippy check:" | tee -a clippy-results.json
        cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic 2>&1 | tee -a clippy-results.json || true
        
        echo "clippy_exit_code=$clippy_exit_code" >> $GITHUB_OUTPUT
    
    # ============================================================================
    # FORMATTING CHECK
    # ============================================================================
    - name: Check code formatting
      id: formatting
      continue-on-error: true
      run: |
        echo "🎨 Checking code formatting..."
        
        cargo fmt --all -- --check 2>&1 | tee format-results.json
        format_exit_code=$?
        
        echo "format_exit_code=$format_exit_code" >> $GITHUB_OUTPUT
    
    # ============================================================================
    # BENCHMARK TESTS (If available)
    # ============================================================================
    - name: Run benchmark tests
      id: benchmarks
      continue-on-error: true
      run: |
        echo "⚡ Running benchmark tests..."
        
        echo '{"benchmark_run": "nightly"}' > benchmark-results.json
        
        # Check for benchmark directories and run them
        benchmark_dirs=$(find . -name "benches" -type d | head -10)
        if [ -n "$benchmark_dirs" ]; then
          for bench_dir in $benchmark_dirs; do
            package_dir=$(dirname "$bench_dir")
            echo "Running benchmarks in $package_dir..." | tee -a benchmark-results.json
            (cd "$package_dir" && timeout 180 cargo bench 2>&1 | tee -a ../benchmark-results.json || true)
          done
        else
          echo "No benchmark directories found" | tee -a benchmark-results.json
        fi
    
    # ============================================================================
    # CODE COVERAGE ANALYSIS (Missions Only)
    # ============================================================================
    - name: Generate code coverage for missions
      id: coverage
      continue-on-error: true
      run: |
        echo "📊 Generating code coverage for missions..."
        
        # Create coverage reports directory
        mkdir -p reports/coverage
        
        # Run tarpaulin for each mission package
        echo '{"coverage_run": "nightly", "packages": []}' > reports/coverage-summary.json
        
        mission_count=0
        total_coverage=0
        
        for mission_dir in missions/Mission*; do
          if [ -d "$mission_dir" ] && [ -f "$mission_dir/Cargo.toml" ]; then
            mission_name=$(basename "$mission_dir")
            echo "Generating coverage for $mission_name..."
            
            # Run tarpaulin with HTML and JSON output
            (cd "$mission_dir" && \
              cargo tarpaulin \
                --out Html \
                --out Json \
                --output-dir ../../reports/coverage/$mission_name \
                --timeout 300 \
                --skip-clean \
                2>&1 | tee ../../reports/coverage/$mission_name/tarpaulin.log || true)
            
            # Extract coverage percentage if JSON exists
            if [ -f "reports/coverage/$mission_name/tarpaulin-report.json" ]; then
              coverage=$(jq -r '.files | to_entries | map(.value.covered) | add / length' reports/coverage/$mission_name/tarpaulin-report.json 2>/dev/null || echo "0")
              echo "$mission_name: ${coverage}% coverage"
              
              mission_count=$((mission_count + 1))
              total_coverage=$(echo "$total_coverage + $coverage" | bc)
            fi
          fi
        done
        
        # Calculate average coverage
        if [ $mission_count -gt 0 ]; then
          avg_coverage=$(echo "scale=2; $total_coverage / $mission_count" | bc)
          echo "Average mission coverage: ${avg_coverage}%"
          echo "avg_coverage=$avg_coverage" >> $GITHUB_OUTPUT
          echo "mission_count=$mission_count" >> $GITHUB_OUTPUT
        else
          echo "avg_coverage=0" >> $GITHUB_OUTPUT
          echo "mission_count=0" >> $GITHUB_OUTPUT
        fi
        
        echo "Coverage analysis complete for $mission_count missions"
    
    # ============================================================================
    # CREATE COMPREHENSIVE REPORT
    # ============================================================================
    - name: Generate comprehensive quality report
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          
          // Gather all results
          const compilationStatus = '${{ steps.compilation.outcome }}' === 'success' ? '✅' : '❌';
          const testsPassed = '${{ steps.test-suite.outputs.passed_tests }}' || '0';
          const testsFailed = '${{ steps.test-suite.outputs.failed_tests }}' || '0';
          const testsTotal = '${{ steps.test-suite.outputs.total_tests }}' || '0';
          const compilationFailed = '${{ steps.test-suite.outputs.compilation_failed }}' === 'true';
          const docGenStatus = '${{ steps.doc-tests.outputs.doc_gen_exit_code }}' === '0' ? '✅' : '❌';
          const docTestStatus = '${{ steps.doc-tests.outputs.doc_test_exit_code }}' === '0' ? '✅' : '❌';
          const clippyStatus = '${{ steps.clippy-analysis.outputs.clippy_exit_code }}' === '0' ? '✅' : '❌';
          const formatStatus = '${{ steps.formatting.outputs.format_exit_code }}' === '0' ? '✅' : '❌';
          
          // Calculate success rate
          const successRate = testsTotal > 0 ? ((testsPassed / testsTotal) * 100).toFixed(1) : '0';
          
          const overallStatus = (testsTotal > 0 && testsFailed === '0' && clippyStatus === '✅' && compilationStatus === '✅' && !compilationFailed) 
            ? '🎉 **ALL CHECKS PASSED**' 
            : '⚠️ **ISSUES FOUND - REVIEW NEEDED**';
            
          const testStatus = (testsFailed === '0' && !compilationFailed) ? '✅' : '❌';
          const failedDisplay = testsFailed === '0' ? '✅' : '❌';
          
          const hasIssues = testsFailed !== '0' || clippyStatus !== '✅' || compilationStatus !== '✅' || compilationFailed;
          
          // Build the report body
          let reportBody = '## 🌙 Nightly Quality Assurance Report\n\n';
          reportBody += '### 📊 Overall Status\n';
          reportBody += overallStatus + '\n\n';
          
          // Add compilation warning if tests failed to compile
          if (compilationFailed) {
            reportBody += '### ⚠️ Compilation Issues\n';
            reportBody += '**Tests failed to compile!** Some packages have compilation errors that prevented tests from running.\n';
            reportBody += 'Check the workflow logs for detailed error messages.\n\n';
          }
          
          reportBody += '### 🧪 Test Results\n';
          if (compilationFailed && testsTotal === '0') {
            reportBody += '⚠️ **No tests executed due to compilation failures**\n\n';
          }
          reportBody += '- **Total Tests**: ' + testsTotal + '\n';
          reportBody += '- **Passed**: ' + testsPassed + ' ✅\n';
          reportBody += '- **Failed**: ' + testsFailed + ' ' + failedDisplay + '\n';
          reportBody += '- **Success Rate**: ' + successRate + '%\n\n';
          
          reportBody += '### 🔍 Code Quality Checks\n';
          reportBody += '| Check | Status | Details |\n';
          reportBody += '|-------|---------|---------|\n';
          const compilationDetails = compilationFailed ? 'Test compilation failed' : 'All packages compile successfully';
          reportBody += '| Compilation | ' + compilationStatus + ' | ' + compilationDetails + ' |\n';
          reportBody += '| Tests | ' + testStatus + ' | ' + testsPassed + '/' + testsTotal + ' tests passing |\n';
          reportBody += '| Documentation Generation | ' + docGenStatus + ' | API docs generated |\n';
          reportBody += '| Documentation Tests | ' + docTestStatus + ' | Code examples in docs |\n';
          reportBody += '| Clippy Analysis | ' + clippyStatus + ' | Linting and best practices |\n';
          reportBody += '| Code Formatting | ' + formatStatus + ' | Consistent code style |\n';
          
          // Add coverage metrics if available
          const coverageStatus = '${{ steps.coverage.outcome }}';
          const avgCoverage = '${{ steps.coverage.outputs.avg_coverage }}';
          const missionCount = '${{ steps.coverage.outputs.mission_count }}';
          
          if (coverageStatus === 'success' && missionCount > 0) {
            reportBody += '| Code Coverage (Missions) | ✅ Completed | ' + avgCoverage + '% avg across ' + missionCount + ' missions |\n';
          } else if (coverageStatus === 'failure') {
            reportBody += '| Code Coverage (Missions) | ❌ Failed | Check workflow logs |\n';
          }
          reportBody += '\n';
          
          // Add coverage section if available
          if (coverageStatus === 'success' && missionCount > 0) {
            reportBody += '### 📊 Code Coverage Analysis\n';
            reportBody += '- **Average Coverage**: ' + avgCoverage + '%\n';
            reportBody += '- **Missions Analyzed**: ' + missionCount + '\n';
            reportBody += '- **Reports**: HTML coverage reports available in workflow artifacts\n';
            reportBody += '- **Next Steps**: ';
            if (parseFloat(avgCoverage) < 70) {
              reportBody += 'Consider adding tests to improve mission coverage\n';
            } else if (parseFloat(avgCoverage) < 85) {
              reportBody += 'Good coverage - focus on edge cases and error paths\n';
            } else {
              reportBody += 'Excellent coverage - maintain quality!\n';
            }
            reportBody += '\n';
          }
          
          reportBody += '### 📋 Key Achievements\n';
          reportBody += '- **Mission8 BFS/DFS Fix**: Edge case handling for non-existent nodes ✅\n';
          reportBody += '- **Comprehensive Coverage**: All ' + testsTotal + ' tests across missions, tutorials, and book chapters\n';
          reportBody += '- **Documentation Tests**: Including the recently fixed edge case tests\n';
          reportBody += '- **Multi-Package Testing**: Individual validation of all workspace members\n\n';
          
          reportBody += '### 🎯 Next Steps\n';
          if (hasIssues) {
            if (compilationFailed) {
              reportBody += '- 🔧 **URGENT**: Fix test compilation errors\n';
            }
            reportBody += '- 🔧 Address failing tests and compilation issues\n';
            reportBody += '- 📋 Review clippy suggestions for code improvements\n';
            reportBody += '- 🧪 Run tests locally before pushing: `cargo test --workspace`\n\n';
          } else {
            reportBody += '- 🎉 All quality checks passing - excellent code health!\n';
            reportBody += '- 🚀 Consider adding more comprehensive benchmarks\n';
            reportBody += '- 📚 Continue expanding test coverage\n\n';
          }
          
          reportBody += '### 📁 Detailed Reports\n';
          reportBody += 'Check the workflow artifacts for complete logs:\n';
          reportBody += '- Compilation results\n';
          reportBody += '- Detailed test output\n';
          reportBody += '- Clippy analysis\n';
          reportBody += '- Documentation generation logs\n';
          reportBody += '- Benchmark results (if available)\n';
          if (coverageStatus === 'success' && missionCount > 0) {
            reportBody += '- 📊 **Code coverage reports** (HTML + JSON for ' + missionCount + ' missions)\n';
          }
          reportBody += '\n';
          
          reportBody += '---\n';
          reportBody += '**Run Details**\n';
          reportBody += '- Workflow ID: `${{ github.run_id }}`\n';
          reportBody += '- Commit: `${{ github.sha }}`\n';
          reportBody += '- Date: ' + new Date().toISOString() + '\n';
          reportBody += '- Triggered by: Nightly schedule';

          // Check for existing issues
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['nightly-qa', 'automated'],
            state: 'open'
          });
          
          const today = new Date().toISOString().split('T')[0];
          const existingToday = existingIssues.data.find(issue => 
            issue.title.includes(today) && issue.title.includes('Quality Report')
          );
          
          if (!existingToday) {
            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🌙 Nightly Quality Report - ${today} (${testsTotal} tests, ${successRate}% pass rate)`,
              body: reportBody,
              labels: ['nightly-qa', 'automated', 'quality-assurance', 'test-results']
            });
          } else {
            // Update existing issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingToday.number,
              body: `## 🔄 Updated Report\n\n${reportBody}`
            });
          }
    
    # ============================================================================
    # UPLOAD ARTIFACTS
    # ============================================================================
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-qa-results-${{ github.run_number }}
        path: |
          reports/test-results.json
          reports/test-output.txt
          reports/compilation-report.json
          reports/doc-test-results.json
          reports/coverage/
          clippy-results.json
          format-results.json
          benchmark-results.json
        retention-days: 30