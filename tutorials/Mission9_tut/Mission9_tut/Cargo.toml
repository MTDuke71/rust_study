[package]
name = "mission9_tut"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies for pathfinding examples
priority-queue = "1.3"
thiserror = "1.0"

# Optional dependencies for advanced examples
criterion = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
proptest = "1.0"

[features]
default = []
benchmarks = ["criterion", "rand"]
serialization = ["serde", "serde_json"]

[[bin]]
name = "step1_priority_queue"
path = "examples/step1_priority_queue_foundation.rs"