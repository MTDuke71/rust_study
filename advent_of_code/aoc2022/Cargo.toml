[package]
name = "aoc2022"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
rayon = "1.8"
rustc-hash = "2.0"
serde_json = "1.0"
mission6 = { path = "../../missions/Mission6" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[lib]
name = "aoc2022"
path = "src/lib.rs"

[[bin]]
name = "aoc2022"
path = "src/main.rs"
